name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-build-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test/build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      - name: Run tests
        run: python -m pytest -q

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Fresh wheel install smoke test
        run: |
          python -m venv /tmp/logmask-wheel-test
          /tmp/logmask-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/logmask-wheel-test/bin/python -m pip install dist/logmask_drain-*.whl
          /tmp/logmask-wheel-test/bin/logmask --help
          /tmp/logmask-wheel-test/bin/logmask synthesize tests/fixtures/toy/sample.txt --backend rules --rule-mode conservative --out /tmp/masks.json
          /tmp/logmask-wheel-test/bin/logmask validate-masks /tmp/masks.json --logs tests/fixtures/toy/sample.txt --strict
          /tmp/logmask-wheel-test/bin/logmask parse tests/fixtures/toy/logs.txt --masks /tmp/masks.json --template-id-mode hash --out /tmp/parsed.jsonl
          /tmp/logmask-wheel-test/bin/logmask report /tmp/parsed.jsonl
          /tmp/logmask-wheel-test/bin/logmask benchmark --logs tests/fixtures/toy/logs.txt --ground-truth tests/fixtures/toy/templates.csv --methods drain,builtin,bundle --masks /tmp/masks.json
          /tmp/logmask-wheel-test/bin/logmask candidate-schema --out /tmp/candidate-schema.json
          /tmp/logmask-wheel-test/bin/logmask benchmark-loghub --structured tests/fixtures/loghub/structured.csv --methods drain,builtin,bundle --masks /tmp/masks.json --label-source "fixture labels" --out /tmp/loghub-benchmark.json
          if /tmp/logmask-wheel-test/bin/logmask synthesize tests/fixtures/toy/sample.txt --backend local-llm --out /tmp/local-masks.json > /tmp/local-llm.out 2>&1; then exit 1; fi
          grep -q "model-path" /tmp/local-llm.out
          WHEEL=$(ls dist/logmask_drain-*.whl)
          /tmp/logmask-wheel-test/bin/python -m pip install "${WHEEL}[drain3]"
          /tmp/logmask-wheel-test/bin/logmask parse tests/fixtures/toy/logs.txt --masks /tmp/masks.json --engine drain3 --template-id-mode hash --out /tmp/parsed-drain3.jsonl
